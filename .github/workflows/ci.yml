name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Parallel test processes must not share tsx's transform cache.
  TSX_DISABLE_CACHE: "1"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Node.js 24.22.1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Pin npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          node -e "if (process.versions.node !== '24.22.1') { console.error(process.versions.node); process.exit(1); }"
          test "$(npm --version)" = "11.21.1"
      - name: Check git (syncing runs needs 2.40 or later)
        run: >-
          node -e "const v = require('node:child_process').execFileSync('git', ['--version'], { encoding: 'utf8' });
          console.log(v.trim()); const [major, minor] = v.match(/(\d+)\.(\d+)/).slice(1).map(Number);
          if (major < 2 || (major === 2 && minor < 40)) { console.error('git 2.40 or later is required'); process.exit(1); }"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node scripts/check-i18n.mjs
      - run: node scripts/check-policy-registry.mjs
      - run: node scripts/check-personal-info.mjs
      - run: node scripts/check-personal-info.mjs --self-test
      - run: node scripts/tokenize-css.mjs --check
      - run: node scripts/generate-third-party-notices.mjs --check
      - run: node scripts/audit.mjs
      - run: npx tsx scripts/render-generated-regions.ts --check
      - run: node scripts/sync-package-meta.mjs --check
      - run: node scripts/sync-installers.mjs --check
      - run: node --test scripts/install.test.mjs scripts/install-wsl.test.mjs
      - run: npx tsx scripts/render-generated-regions.ts --self-test
      - run: node scripts/npm-readme.mjs --check-docs
      - run: node scripts/npm-readme.mjs --self-test
      - run: node site/check-site.mjs

  homebrew-installer:
    name: Homebrew installer
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the Homebrew formula
        run: |
          brew tap-new bell-pr/install-test
          cp Formula/bell-pr.rb "$(brew --repository bell-pr/install-test)/Formula/bell-pr.rb"
          brew install bell-pr/install-test/bell-pr
          brew test bell-pr/install-test/bell-pr

  powershell-installer:
    name: PowerShell installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Parse the installer without configuring WSL
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Test installer behavior with WSL fixtures
        env:
          BELLPR_TEST_POWERSHELL: powershell
        run: node --test scripts/install-powershell.test.mjs

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Pin npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          node -e "if (process.versions.node !== '24.22.1') { console.error(process.versions.node); process.exit(1); }"
          test "$(npm --version)" = "11.21.1"
      - run: npm ci
      - name: Pack file list matches scripts/pack-expected.txt
        run: node scripts/pack-expected.mjs --check
      - name: Pack (prepack builds)
        run: |
          npm pack
          # check-pack must leave this tarball as it is; the next two steps compare.
          sha256sum "bell-pr-$(node -p "require('./package.json').version").tgz" > "$RUNNER_TEMP/tarball.sha256"
      - name: Check the packed tarball as it is
        run: |
          node scripts/check-pack.mjs --tarball "bell-pr-$(node -p "require('./package.json').version").tgz"
          sha256sum -c "$RUNNER_TEMP/tarball.sha256"
      - name: Check the build with check-pack's own pack, which leaves nothing behind
        run: |
          # The default mode packs into a temporary folder of its own and removes it.
          mkdir "$RUNNER_TEMP/check-pack-tmp"
          TMPDIR="$RUNNER_TEMP/check-pack-tmp" node scripts/check-pack.mjs
          sha256sum -c "$RUNNER_TEMP/tarball.sha256"
          tarballs="$(ls bell-pr-*.tgz)"
          if [ "$tarballs" != "bell-pr-$(node -p "require('./package.json').version").tgz" ]; then
            echo "::error::check-pack left a tarball in the checkout: $tarballs"; exit 1
          fi
          left="$(find "$RUNNER_TEMP/check-pack-tmp" -mindepth 1 -maxdepth 1 -name 'bell-pr-*')"
          if [ -n "$left" ]; then echo "::error::check-pack left $left"; exit 1; fi
      - name: Install the tarball into a temporary prefix
        run: npm install -g --prefix "$RUNNER_TEMP/p" ./bell-pr-*.tgz
      - name: Run the installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          export PATH="$RUNNER_TEMP/p/bin:$PATH"
          version="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          bell-pr --version
          bell-pr --version | grep -F "$version"
      - name: Start the installed server
        working-directory: ${{ runner.temp }}
        env:
          BELLPR_DATA_DIR: ${{ runner.temp }}/d
          BELLPR_NO_OPEN: "1"
        run: |
          # Agent CLIs that always fail, so nothing real can start.
          mkdir -p fake-bin
          for name in codex claude gh; do printf '#!/bin/sh\nexit 1\n' > "fake-bin/$name"; chmod +x "fake-bin/$name"; done
          export PATH="$RUNNER_TEMP/fake-bin:$RUNNER_TEMP/p/bin:$PATH"
          # Fake CLIs fail the readiness gate; --force is the sample-tour path.
          bell-pr start --force --port 4598 > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat server.log' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4598/api/health
          echo
          type="$(curl -fsS -b jar -o /dev/null -w '%{content_type}' http://127.0.0.1:4598/)"
          echo "GET / -> $type"
          case "$type" in text/html*) ;; *) exit 1 ;; esac
      - run: node scripts/check-personal-info.mjs --pack

  e2e:
    name: End-to-end tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Pin npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          node -e "if (process.versions.node !== '24.22.1') { console.error(process.versions.node); process.exit(1); }"
          test "$(npm --version)" = "11.21.1"
      - name: Read the Playwright version from the lockfile
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages for Playwright's system libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Leave apt's root-owned scratch files out of the cache.
          path: |
            ~/.cache/apt-archives
            !~/.cache/apt-archives/partial
            !~/.cache/apt-archives/lock
          key: apt-archives-${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install packages, Chromium's libraries, and Chromium on a cache miss
        run: |
          version="${{ steps.playwright-version.outputs.version }}"
          # Retry a stalled font download and reuse the packages next time.
          mkdir -p "$HOME/.cache/apt-archives/partial"
          # _apt must own partial/ so apt keeps its download sandbox.
          sudo chown _apt "$HOME/.cache/apt-archives/partial"
          sudo tee /etc/apt/apt.conf.d/99-playwright-fetch >/dev/null <<EOF
          Dir::Cache::archives "$HOME/.cache/apt-archives";
          Acquire::Retries "5";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          # Overlap Chromium's apt libraries with npm ci; a hit still installs them and skips the browser download.
          npx --yes "playwright@${version}" install-deps chromium &
          deps=$!
          npm ci
          installed="$(node -p "require('playwright/package.json').version")"
          test "$installed" = "$version"
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          wait "$deps"
      - name: Run the end-to-end tests (builds, then starts bell-pr on port 4599)
        env:
          BELLPR_E2E_PORT: "4599"
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # Cut at a file boundary to balance the shards; see test-cli docs.
          cut=e2e/responsive.spec.ts
          files=()
          while IFS= read -r file; do
            if [[ "$file" < "$cut" ]]; then
              [[ "$SHARD" == 1 ]] && files+=("$file")
            else
              [[ "$SHARD" == 2 ]] && files+=("$file")
            fi
          done < <(LC_ALL=C find e2e -name '*.spec.ts' -type f | LC_ALL=C sort)
          [[ ${#files[@]} -gt 0 ]]
          # Shard 2's test step is shorter, so the site check runs there before the tests.
          if [[ "$SHARD" == 2 ]]; then
            node site/check-site.mjs --browser
          fi
          npm run test:e2e -- "${files[@]}" | tee "$RUNNER_TEMP/e2e-shard.log" && status=0 || status=$?
          summary=$(grep -E '^[[:space:]]+[0-9]+ (passed|failed|flaky|skipped)' "$RUNNER_TEMP/e2e-shard.log" | sed 's/^[[:space:]]*//' | paste -sd ' ' - || true)
          echo "shard ${SHARD}: ${#files[@]} files; ${summary}"
          exit "$status"
      - name: Upload the traces and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: e2e/output/
          retention-days: 14

  e2e-summary:
    name: End-to-end tests
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to succeed
        run: |
          result="${{ needs.e2e.result }}"
          echo "e2e shard result: ${result}"
          test "$result" = "success"

  pack-list:
    name: Pack expected file list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Pin npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          node -e "if (process.versions.node !== '24.22.1') { console.error(process.versions.node); process.exit(1); }"
          test "$(npm --version)" = "11.21.1"
      - run: npm ci
      - name: Compare npm pack --dry-run file list to scripts/pack-expected.txt
        run: node scripts/pack-expected.mjs --check

  docker:
    name: Docker build
    # Builds only; nothing is pushed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t bell-pr:ci .
      - name: Check the tools in the image
        run: |
          docker run --rm --entrypoint sh bell-pr:ci -c 'for c in bwrap socat codex gh git; do command -v "$c" || exit 1; done; git --version'
      - name: Start the image and wait until it is healthy
        run: |
          # CI has no provider login; exercise the sample-tour startup path.
          docker run -d --name bellpr-ci --health-interval 2s -p 127.0.0.1:4311:4311 bell-pr:ci start --force
          trap 'docker logs bellpr-ci 2>&1 | sed "s/t=[A-Za-z0-9_-]*/t=***/"; docker rm -f bellpr-ci' EXIT
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bellpr-ci)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          docker exec bellpr-ci bell-pr --version
