name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Search the existing issues first, and look at `docs/troubleshooting.md`, which lists the error codes BELL PR shows.

        **A security problem does not belong here.** Follow `SECURITY.md` and report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see instead of what you expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. Say whether it happens with the sample project or only with a project you imported.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BELL PR version
      description: The output of `bell-pr --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run BELL PR?
      options:
        - npx bell-pr
        - Global npm install
        - Docker image
        - From source (npm run dev or npm start)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, Node.js and Git versions
      placeholder: Ubuntu 24.04, Node.js 22.12, Git 2.43
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent CLI involved
      options:
        - Not involved
        - Codex CLI
        - Claude Code CLI
        - Both
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bell-pr doctor`
      description: It lists the tools BELL PR found and their versions. Remove anything private before you paste it.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Error codes, messages and logs
      description: The error code and text BELL PR showed, and the relevant lines of the local service log. Remove sign-in links, tokens and private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no report of this problem.
          required: true
        - label: I removed sign-in links, tokens and private data from everything I pasted.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
